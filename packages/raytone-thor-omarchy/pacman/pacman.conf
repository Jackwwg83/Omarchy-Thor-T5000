# RaytoneOS Omarchy on Jetson AGX Thor (aarch64). Installed by raytone-thor-omarchy; Omarchy's
# post-install and refresh-pacman steps restore this file instead of the x86_64 template.
#
# Repository order matters: pacman takes a package from the first repository that has it, so the
# port's own builds (L4T drivers, patched Hyprland, Omarchy from the stable release) always win.
[options]
HoldPkg     = pacman glibc
Architecture = aarch64
IgnorePkg   = linux-aarch64 linux-aarch64-headers
Color
CheckSpace
VerbosePkgLists
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[raytone-thor]
Server = file:///var/lib/raytone/repo

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[alarm]
Include = /etc/pacman.d/mirrorlist

[aur]
Include = /etc/pacman.d/mirrorlist

# Omarchy's own aarch64 packages (keyring, fonts, apps missing from Arch Linux ARM). Only the edge
# channel publishes aarch64 today.
[omarchy]
Server = https://pkgs.omarchy.org/edge/$arch
