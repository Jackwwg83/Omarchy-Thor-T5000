# RaytoneOS Omarchy on Jetson AGX Thor: the greeter's Hyprland must use the display device, as the
# session does (see /usr/share/uwsm/env.d/20-raytone-thor). Read after omarchy-settings'
# 10-wayland.conf; the command is upstream's, recorded in raytone-thor-omarchy's WATCHED.sha256.
[Wayland]
CompositorCommand=env AQ_DRM_DEVICES=/dev/dri/by-path/platform-8808c00000.display-card start-hyprland -- --config /usr/share/sddm/hyprland.lua
