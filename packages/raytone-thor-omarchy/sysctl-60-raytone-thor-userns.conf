# RaytoneOS Jetson AGX Thor: the L4T kernel restricts unprivileged user namespaces through AppArmor
# (an Ubuntu default), and Arch ships no AppArmor profiles that would allow any: every one was
# refused, so sandboxes built on them (bubblewrap, as Codex uses) could not start. Arch's own
# kernels allow them.
kernel.apparmor_restrict_unprivileged_userns = 0
